<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Cañaña | Menú Digital</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header">
        <h1>LA CAÑAÑA</h1>
        <p>RESTAURANTE</p>
    </header>

    <main>

        <section class="hero">
            <h2>Nuestro menú</h2>
            <p>El sabor que siempre quieres repetir.</p>
        </section>

        <section class="menu">

            <nav class="categories">
                <button class="category active" data-category="hamburguesas">
                    Hamburguesas
                </button>
            
                <button class="category" data-category="perros">
                    Perros calientes
                </button>
            
                <button class="category" data-category="salchipapas">
                    Salchipapas
                </button>
            
                <button class="category" data-category="burritos">
                    Burritos
                </button>
            
                <button class="category" data-category="asados">
                    Asados
                </button>
            
                <button class="category" data-category="picadas">
                    Picadas
                </button>
            
                <button class="category" data-category="adicionales">
                    Adicionales
                </button>
            </nav>

            <div class="category-banner">
                <img id="categoryImage" src="" alt="">
            </div>

            <div class="products">
                <!-- Aquí mostraremos los productos -->
            </div>

        </section>

    </main>

    <footer class="footer">
        <h3>CONTACTO PEDIDO</h3>
        <p class="footer-subtitle">3021299347</p>
    
        <div class="footer-line"></div>
    
        <p class="footer-credit">
            Diseñado y desarrollado por
            <strong>Ing. Elias Jabba</strong>
        </p>
    
        <p class="footer-copy">
            © 2026 La Cañana Restaurante. Todos los derechos reservados.
        </p>
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
